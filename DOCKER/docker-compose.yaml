version: "1.0"

services:
  villany-backend:
    image: villanyszamlakoltsegek-backend:latest
    container_name: villanyszamlakoltsegek-backend
    ports:
      - "127.0.0.1:5063:5063"
    environment:
      - ASPNETCORE_URLS=http://+:5063
    networks:
      - "villanyszamlakoltsegek-halozat"
      
  frontend:
    image: villanyszamlakoltsegek-frontend:latest
    container_name: villanyszamlakoltsegek-frontend
    ports:
      - "127.0.0.1:8081:80"
    networks:
      - "villanyszamlakoltsegek-halozat"
      
networks:
  villanyszamlakoltsegek-halozat:
    driver: bridge